[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/sahil-shubham/spoiler"
homepage = "https://github.com/sahil-shubham/spoiler"
authors = ["Sahil Shubham"]

[workspace.dependencies]
spoiler-core = { path = "crates/core" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value", "unbounded_depth"] }
serde_stacker = "0.1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
url = "2"
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
