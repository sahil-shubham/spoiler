[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/sahil-shubham/spoiler"
homepage = "https://spoiler.sh"
authors = ["Sahil Shubham"]

[workspace.dependencies]
# Exact: the crates are released in lockstep, and cargo rejects a pin that disagrees with the path.
spoiler-core = { path = "crates/core", version = "=0.1.3" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
httpdate = "1"
indexmap = { version = "2", features = ["serde"] }
oxc_allocator = "0.152"
oxc_ast = "0.152"
oxc_ast_visit = "0.152"
oxc_parser = "0.152"
oxc_resolver = "11"
oxc_span = "0.152"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value", "unbounded_depth"] }
serde_stacker = "0.1"
serde_yaml = "0.9"
sha2 = "0.10"
snap = "1"
thiserror = "2"
url = "2"
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
