# Releases a `v*` tag: Python wheels of the `spoiler` binary on PyPI, the `spoiler-core` and
# `spoiler` crates on crates.io, and a binary archive per target on GitHub Releases. Every
# artifact is built here from the tagged commit, and nothing is published until the tag check, CI,
# every build and its smoke test, the sdist build, and the crates.io dry run have passed:
#
#   plan, ci, build (6 targets), sdist, crates ──► publish-pypi, publish-crates ──► github-release
#
# Pull requests that touch packaging, and manual runs on a branch, do everything except publish.
# Publishing is idempotent (versions already on PyPI or crates.io are skipped; an existing GitHub
# release has its assets replaced), so "Re-run failed jobs" completes a release that stopped
# halfway.
#
# One-time setup. No tokens are stored: both registries use trusted publishing.
# - PyPI: add a pending trusted publisher for project `spoiler` with this repository, workflow
#   `release.yml`, and environment `pypi`.
# - crates.io cannot create a crate through trusted publishing. Publish the first version by hand
#   (`cargo publish --workspace`), then add a trusted publisher to both `spoiler-core` and
#   `spoiler` with this repository, workflow `release.yml`, and environment `crates-io`.
# - GitHub: create the environments `pypi` and `crates-io`. Required reviewers on them turn every
#   release into a manual approval.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release.py
      - pyproject.toml
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - crates/*/Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

# A tag's run is never cancelled: it may be partway through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  MATURIN_VERSION: v1.15.0

jobs:
  plan:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
      - name: Check the tag and extract its release notes
        run: python3 scripts/release.py "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  ci:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml

  # One compile per target yields both the wheel and the archived binary.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.28+: manylinux2014's aarch64 gcc cannot build ring.
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, manylinux: "2_28" }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, manylinux: "2_28" }
          # Statically linked: the wheel serves Alpine, and the archive runs on any Linux.
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, manylinux: musllinux_1_2 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, manylinux: musllinux_1_2 }
          - { target: aarch64-apple-darwin, runner: macos-latest }
          # Cross-compiled on Apple silicon (GitHub retires its last Intel macOS image in August
          # 2027), so it is checked for its architecture instead of run.
          - { target: x86_64-apple-darwin, runner: macos-latest, cross: true }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Archive the binary
        run: |
          name=spoiler-$TARGET
          mkdir "$name" archive
          cp "target/$TARGET/release/spoiler" LICENSE-MIT LICENSE-APACHE README.md "$name/"
          tar --no-xattrs -czf "archive/$name.tar.gz" "$name"
          cd archive && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Unpack the archive
        run: tar -xzf "archive/spoiler-$TARGET.tar.gz" -C "$RUNNER_TEMP"
      - name: Run the archived binary
        if: ${{ !matrix.cross }}
        run: '"$RUNNER_TEMP/spoiler-$TARGET/spoiler" --version'
      - name: Check the archived binary's architecture
        if: ${{ matrix.cross }}
        run: test "$(lipo -archs "$RUNNER_TEMP/spoiler-$TARGET/spoiler")" = "${TARGET%%-*}"
      # pip on a glibc host refuses musllinux wheels; the musl binary itself ran above.
      - name: Install and run the wheel
        if: ${{ !matrix.cross && !endsWith(matrix.target, '-musl') }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-index dist/*.whl
          "$RUNNER_TEMP/venv/bin/spoiler" --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-${{ matrix.target }}
          path: archive
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      # What pip does on a platform without a wheel: build the binary from the sdist alone.
      - name: Install and run the sdist
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.tar.gz
          "$RUNNER_TEMP/venv/bin/spoiler" --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-sdist
          path: dist
          if-no-files-found: error

  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
      # Packages each crate as crates.io would receive it and builds it from that tarball alone.
      - run: cargo publish --workspace --dry-run --locked

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [plan, ci, build, sdist, crates]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  publish-crates:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [plan, ci, build, sdist, crates]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish the crates not yet on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          crates=$(cargo metadata --format-version 1 --no-deps |
            jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"')
          packages=()
          while read -r name version; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              --user-agent "$GITHUB_REPOSITORY release workflow" \
              "https://crates.io/api/v1/crates/$name/$version")
            case $status in
              200) echo "$name $version is already on crates.io" ;;
              404) packages+=(--package "$name") ;;
              *) echo "crates.io answered $status for $name $version" >&2; exit 1 ;;
            esac
          done <<< "$crates"
          # Cargo publishes them in dependency order, waiting for each to reach the index.
          if [ ${#packages[@]} -gt 0 ]; then
            cargo publish --locked "${packages[@]}"
          fi

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-pypi, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: archive-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - name: Create the release, or replace the assets of an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            flags=()
            if [[ $TAG == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" assets/* --verify-tag --title "$TAG" \
              --notes-file release-notes.md "${flags[@]}"
          fi
